<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NCVT Online Verification</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f5; display: flex; justify-content: center; padding: 30px; }
    .card { background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 600px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .row { display: flex; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    .label { font-weight: bold; width: 40%; color: #555; }
    .val { width: 60%; color: #111; }
    .error { color: red; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<div class="card" id="content">Loading Data...</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const rollNo = urlParams.get('roll') || urlParams.get('id');

  if (!rollNo) {
    document.getElementById('content').innerHTML = "<div class='error'>❌ Roll Number Missing</div>";
  } else {
    // Save kiye huye JSON file se data fetch karna
    fetch('students.json')
      .then(response => response.json())
      .then(data => {
        if (data[rollNo]) {
          const s = data[rollNo];
          document.getElementById('content').innerHTML = `
            <h2 style="color:green; text-align:center;">✅ Verified Certificate</h2>
            <div class="row"><div class="label">Roll Number:</div><div class="val">${rollNo}</div></div>
            <div class="row"><div class="label">Student Name:</div><div class="val">${s.name}</div></div>
            <div class="row"><div class="label">Father Name:</div><div class="val">${s.father}</div></div>
            <div class="row"><div class="label">Trade:</div><div class="val">${s.trade}</div></div>
            <div class="row"><div class="label">Exam Date:</div><div class="val">${s.examDate}</div></div>
            <div class="row"><div class="label">Marks:</div><div class="val">${s.marks}</div></div>
            <div class="row"><div class="label">Status:</div><div class="val" style="color:green; font-weight:bold;">${s.status}</div></div>
          `;
        } else {
          document.getElementById('content').innerHTML = "<div class='error'>❌ Invalid Roll Number / Certificate Not Found</div>";
        }
      })
      .catch(err => {
        document.getElementById('content').innerHTML = "<div class='error'>❌ Error loading database</div>";
      });
  }
</script>

</body>
</html>
